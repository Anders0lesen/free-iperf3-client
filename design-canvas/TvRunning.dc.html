<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#05090D; --surf:#0B1218; --raised:#101920; --border:#24313A;
      --text:#F4F7FA; --muted:#AEB9C2;
      --teal:#14D8C4; --blue:#2F80FF; --green:#35D05B; --purple:#C05EF5; --orange:#FF9800; --red:#FF6070;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--teal);} a:hover{color:#0fb3a2;}
    .screen{position:relative;width:100%;height:100%;padding:18px 22px;
      background:radial-gradient(90% 90% at 8% 12%, rgba(20,216,196,.09), transparent 55%),
                 radial-gradient(90% 90% at 100% 90%, rgba(47,128,255,.055), transparent 55%);}
    .stack{display:flex;flex-direction:column;}
    .row{display:flex;align-items:center;}
    .card{border-radius:18px;border:1px solid var(--border);
      background:linear-gradient(135deg,rgba(16,25,32,.96),rgba(11,18,24,.96));}
    .orb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    svg{display:block;}
  </style>
</helmet>

<div class="screen stack" style="gap:14px;">

  <!-- Top bar -->
  <div class="row" style="gap:12px;">
    <div style="flex:1;font-size:22px;font-weight:600;">Testing</div>
    <div style="width:36px;height:36px;display:flex;align-items:center;justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F7FA" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
  </div>

  <!-- Progress -->
  <div style="height:6px;border-radius:50px;background:var(--border);overflow:hidden;flex:0 0 auto;">
    <div style="height:100%;width:62%;background:var(--blue);border-radius:50px;"></div>
  </div>

  <!-- Two-column body -->
  <div class="row" style="flex:1;gap:20px;align-items:stretch;">

    <!-- LEFT: state + numbers -->
    <div class="stack" style="flex:0.85;gap:14px;min-width:0;">
      <div class="card row" style="gap:14px;padding:14px 16px;">
        <div class="orb" style="background:rgba(47,128,255,.11);border:1px solid rgba(47,128,255,.25);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F80FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>
        </div>
        <div class="stack" style="flex:1;gap:1px;"><div style="color:var(--blue);font-size:16px;font-weight:600;">TCP Download</div><div style="font-size:12px;">Test running · stage 1 of 1</div></div>
      </div>

      <div class="card stack" style="flex:1;align-items:center;justify-content:center;gap:4px;padding:16px;">
        <div class="row" style="align-items:baseline;gap:8px;">
          <div style="color:var(--blue);font-size:56px;font-weight:800;line-height:1;">642</div>
          <div style="color:var(--muted);font-size:18px;">Mbit/s</div>
        </div>
        <div style="color:var(--muted);font-size:13px;">Running 6 of 10 seconds</div>
      </div>

      <div class="card row" style="gap:10px;padding:12px 16px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
        <div class="mono" style="flex:1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">iperf3 -c 192.168.1.50 -p 5201 -t 10 -R -J</div>
      </div>

      <button style="height:46px;border:none;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,96,112,.13);color:var(--red);font-size:14px;font-weight:600;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        Cancel test
      </button>
    </div>

    <!-- RIGHT: large chart -->
    <div class="card stack" style="flex:1.15;padding:16px;min-width:0;">
      <div style="color:var(--muted);font-size:12px;">Mbit/s</div>
      <div style="flex:1;position:relative;margin-top:8px;">
        <svg width="100%" height="100%" viewBox="0 0 520 360" preserveAspectRatio="none">
          <g stroke="#24313A" stroke-width="1" opacity="0.7">
            <line x1="40" y1="10" x2="512" y2="10"/><line x1="40" y1="97" x2="512" y2="97"/>
            <line x1="40" y1="184" x2="512" y2="184"/><line x1="40" y1="271" x2="512" y2="271"/>
            <line x1="40" y1="340" x2="512" y2="340"/>
          </g>
          <defs><linearGradient id="tvfill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2F80FF" stop-opacity="0.28"/><stop offset="1" stop-color="#2F80FF" stop-opacity="0"/>
          </linearGradient></defs>
          <path d="M50 340 L50 210 L130 130 L210 168 L290 108 L370 96 L450 118 L500 104 L500 340 Z" fill="url(#tvfill)"/>
          <polyline points="50,210 130,130 210,168 290,108 370,96 450,118 500,104" fill="none" stroke="#2F80FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <g fill="#2F80FF"><circle cx="50" cy="210" r="3.5"/><circle cx="130" cy="130" r="3.5"/><circle cx="210" cy="168" r="3.5"/><circle cx="290" cy="108" r="3.5"/><circle cx="370" cy="96" r="3.5"/><circle cx="450" cy="118" r="3.5"/><circle cx="500" cy="104" r="3.5"/></g>
        </svg>
        <div class="mono" style="position:absolute;left:0;top:4px;color:#A0ADB8;font-size:11px;">800</div>
        <div class="mono" style="position:absolute;left:0;top:50%;color:#A0ADB8;font-size:11px;">400</div>
        <div class="mono" style="position:absolute;left:0;bottom:14px;color:#A0ADB8;font-size:11px;">0</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
