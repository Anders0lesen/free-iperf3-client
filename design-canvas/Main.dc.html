<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#05090D; --surf:#0B1218; --raised:#101920; --border:#24313A;
      --text:#F4F7FA; --muted:#AEB9C2;
      --teal:#14D8C4; --blue:#2F80FF; --green:#35D05B; --purple:#C05EF5; --orange:#FF9800; --red:#FF6070;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--teal);} a:hover{color:#0fb3a2;}
    .screen{padding:10px 16px 16px;
      background:radial-gradient(120% 80% at 12% 18%, rgba(20,216,196,.09), transparent 60%),
                 radial-gradient(120% 90% at 100% 70%, rgba(47,128,255,.055), transparent 55%);}
    .stack{display:flex;flex-direction:column;}
    .row{display:flex;align-items:center;}
    .card{border-radius:18px;border:1px solid var(--border);
      background:linear-gradient(135deg,rgba(16,25,32,.96),rgba(11,18,24,.96));}
    .orb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .lbl{color:var(--muted);font-size:12px;}
    .divider{height:1px;background:rgba(36,49,58,.65);margin:0 16px;}
    svg{display:block;}
  </style>
</helmet>

<div class="screen stack" style="gap:12px;">

  <!-- Header (compact) -->
  <div class="row" style="justify-content:space-between;align-items:flex-end;height:52px;">
    <div class="stack" style="gap:1px;">
      <div style="font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1;">Free iperf3 Client</div>
      <div style="color:var(--teal);font-size:14px;font-weight:500;">Simply free.</div>
    </div>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#AEB9C2"><path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.49-1.11-1.49-.91-.63.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.36-2.22-.26-4.55-1.14-4.55-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05a9.3 9.3 0 0 1 5 0c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.82 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.25C22 6.58 17.52 2 12 2z"/></svg>
  </div>

  <!-- Config card -->
  <div class="card stack">
    <div class="row" style="gap:14px;padding:11px 16px;">
      <div class="orb" style="background:rgba(20,216,196,.11);border:1px solid rgba(20,216,196,.25);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14D8C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M10 17v4M14 17v4M7 8l2 2-2 2M13 12h4"/></svg>
      </div>
      <div class="stack" style="flex:1;gap:1px;">
        <div class="lbl">Server address</div>
        <div style="font-size:16px;font-weight:500;">192.168.1.50</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4M14 7l3 3"/></svg>
    </div>
    <div class="divider"></div>
    <div class="row" style="gap:14px;padding:11px 16px;">
      <div class="orb" style="background:rgba(20,216,196,.11);border:1px solid rgba(20,216,196,.25);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14D8C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="7" rx="2"/><path d="M8 10v4M16 10v4M4 14h16M6 14v7M10 14v5M14 14v5M18 14v7"/></svg>
      </div>
      <div class="stack" style="flex:1;gap:1px;">
        <div class="lbl">Port</div>
        <div style="font-size:16px;font-weight:500;">5201</div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4M14 7l3 3"/></svg>
    </div>
    <div class="divider"></div>
    <div class="row" style="gap:14px;padding:11px 16px;">
      <div class="orb" style="background:rgba(20,216,196,.11);border:1px solid rgba(20,216,196,.25);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14D8C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M12 13l3 2M9 2h6M12 2v3M18 6l2 2"/></svg>
      </div>
      <div class="stack" style="flex:1;gap:1px;">
        <div class="lbl">Duration</div>
        <div style="font-size:16px;font-weight:500;">10<span style="color:var(--muted);font-size:13px;font-weight:400;"> seconds</span></div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4M14 7l3 3"/></svg>
    </div>
    <div class="divider"></div>
    <div class="row" style="gap:14px;padding:11px 16px;">
      <div class="orb" style="background:rgba(20,216,196,.11);border:1px solid rgba(20,216,196,.25);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14D8C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l3-9 6 18 3-9h3"/></svg>
      </div>
      <div class="stack" style="flex:1;gap:1px;">
        <div class="lbl">UDP target</div>
        <div style="font-size:16px;font-weight:500;">50<span style="color:var(--muted);font-size:13px;font-weight:400;"> Mbit/s</span></div>
      </div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4M14 7l3 3"/></svg>
    </div>
  </div>

  <!-- Recent servers (compact, single line) -->
  <div class="card row" style="gap:12px;padding:10px 12px 10px 16px;background:linear-gradient(135deg,rgba(20,216,196,.10),rgba(11,18,24,.96));">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14D8C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M11 7h7M11 17h7"/><circle cx="7" cy="7" r="0.9" fill="#14D8C4"/><circle cx="7" cy="17" r="0.9" fill="#14D8C4"/></svg>
    <div class="stack" style="flex:1;gap:1px;">
      <div style="color:var(--teal);font-size:14px;">192.168.1.50:5201</div>
      <div style="color:var(--muted);font-size:11px;">Recent · tap to switch</div>
    </div>
    <div style="color:var(--muted);font-size:12px;">Clear all</div>
  </div>

  <!-- Test choice grid 2x2 (compact, icon + title) -->
  <div class="stack" style="gap:10px;">
    <div class="row" style="gap:10px;align-items:stretch;">
      <div class="card row" style="flex:1;height:56px;gap:12px;padding:0 14px;
        border:2px solid rgba(47,128,255,.7);background:linear-gradient(135deg,rgba(47,128,255,.16),#0B1218);">
        <div class="orb" style="background:rgba(47,128,255,.11);border:1px solid rgba(47,128,255,.25);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F80FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>
        </div>
        <div style="font-size:14px;font-weight:600;">TCP Download</div>
      </div>
      <div class="card row" style="flex:1;height:56px;gap:12px;padding:0 14px;">
        <div class="orb" style="background:rgba(53,208,91,.11);border:1px solid rgba(53,208,91,.25);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#35D05B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V8M7 13l5-5 5 5M5 3h14"/></svg>
        </div>
        <div style="font-size:14px;font-weight:600;">TCP Upload</div>
      </div>
    </div>
    <div class="row" style="gap:10px;align-items:stretch;">
      <div class="card row" style="flex:1;height:56px;gap:12px;padding:0 14px;">
        <div class="orb" style="background:rgba(192,94,245,.11);border:1px solid rgba(192,94,245,.25);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C05EF5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13M17 4l3 3-3 3M17 17H4M7 14l-3 3 3 3"/></svg>
        </div>
        <div style="font-size:14px;font-weight:600;">Bidirectional</div>
      </div>
      <div class="card row" style="flex:1;height:56px;gap:12px;padding:0 14px;">
        <div class="orb" style="background:rgba(255,152,0,.11);border:1px solid rgba(255,152,0,.25);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF9800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l3-9 6 18 3-9h3"/></svg>
        </div>
        <div style="font-size:14px;font-weight:600;">UDP Quality</div>
      </div>
    </div>
  </div>

  <!-- Run all + detection (side by side, compact) -->
  <div class="row" style="gap:10px;align-items:stretch;">
    <div class="card row" style="flex:1;height:48px;gap:10px;padding:0 12px;">
      <div class="orb" style="background:rgba(20,216,196,.11);border:1px solid rgba(20,216,196,.25);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14D8C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 7l9 5 9-5-9-5M3 12l9 5 9-5M3 17l9 5 9-5"/></svg>
      </div>
      <div style="flex:1;font-size:14px;font-weight:600;">Run All</div>
    </div>
    <div class="card row" style="flex:1;height:48px;gap:10px;padding:0 12px;">
      <div class="orb" style="background:rgba(174,185,194,.11);border:1px solid rgba(174,185,194,.25);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M11 7h7M11 17h7"/><circle cx="7" cy="7" r="0.9" fill="#AEB9C2"/><circle cx="7" cy="17" r="0.9" fill="#AEB9C2"/></svg>
      </div>
      <div style="flex:1;font-size:14px;font-weight:600;">Find servers</div>
    </div>
  </div>

  <!-- Start card (compact) -->
  <div class="row" style="height:52px;gap:14px;padding:0 20px;border-radius:16px;
    border:1px solid var(--border);background:linear-gradient(90deg,#0A2625,#0B4441);">
    <div style="width:38px;height:38px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;flex:0 0 auto;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>
    </div>
    <div style="color:var(--teal);font-size:18px;font-weight:800;flex:1;">Start Test</div>
    <div style="color:var(--muted);font-size:13px;">TCP Download</div>
  </div>

</div>
</x-dc>
</body>
</html>
