<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#05090D; --surf:#0B1218; --raised:#101920; --border:#24313A;
      --text:#F4F7FA; --muted:#AEB9C2;
      --teal:#14D8C4; --blue:#2F80FF; --green:#35D05B; --purple:#C05EF5; --orange:#FF9800; --red:#FF6070;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--teal);} a:hover{color:#0fb3a2;}
    .screen{padding:8px 16px 16px;
      background:radial-gradient(120% 80% at 12% 18%, rgba(20,216,196,.09), transparent 60%),
                 radial-gradient(120% 90% at 100% 70%, rgba(47,128,255,.055), transparent 55%);}
    .stack{display:flex;flex-direction:column;}
    .row{display:flex;align-items:center;}
    .card{border-radius:18px;border:1px solid var(--border);
      background:linear-gradient(135deg,rgba(16,25,32,.96),rgba(11,18,24,.96));}
    .orb{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
    svg{display:block;}
  </style>
</helmet>

<div class="screen stack" style="gap:12px;">

  <!-- Top bar -->
  <div class="row" style="height:40px;">
    <div style="width:40px;"></div>
    <div style="flex:1;text-align:center;font-size:20px;font-weight:600;">Testing</div>
    <div style="width:40px;height:40px;display:flex;align-items:center;justify-content:center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F7FA" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
  </div>

  <!-- Mode card -->
  <div class="card row" style="gap:14px;padding:14px 16px;">
    <div class="orb" style="background:rgba(47,128,255,.11);border:1px solid rgba(47,128,255,.25);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F80FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg>
    </div>
    <div class="stack" style="flex:1;gap:1px;">
      <div style="color:var(--blue);font-size:16px;font-weight:600;">TCP Download</div>
      <div style="font-size:12px;">Test running · stage 1 of 1</div>
    </div>
  </div>

  <!-- Progress -->
  <div style="height:6px;border-radius:50px;background:var(--border);overflow:hidden;">
    <div style="height:100%;width:62%;background:var(--blue);border-radius:50px;"></div>
  </div>

  <!-- Live hero (compact) -->
  <div class="card row" style="align-items:baseline;justify-content:center;gap:8px;padding:14px;">
    <div style="color:var(--blue);font-size:40px;font-weight:800;line-height:1;">642</div>
    <div style="color:var(--muted);font-size:15px;">Mbit/s</div>
    <div style="color:var(--muted);font-size:12px;margin-left:8px;">6 / 10 s</div>
  </div>

  <!-- Throughput chart -->
  <div class="card stack" style="padding:14px;">
    <div style="color:var(--muted);font-size:11px;">Mbit/s</div>
    <div style="height:150px;position:relative;margin-top:6px;">
      <svg width="100%" height="150" viewBox="0 0 354 150" preserveAspectRatio="none">
        <g stroke="#24313A" stroke-width="1" opacity="0.7">
          <line x1="34" y1="6" x2="348" y2="6"/><line x1="34" y1="42" x2="348" y2="42"/>
          <line x1="34" y1="78" x2="348" y2="78"/><line x1="34" y1="114" x2="348" y2="114"/>
        </g>
        <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2F80FF" stop-opacity="0.28"/><stop offset="1" stop-color="#2F80FF" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="M34 132 L60 88 L110 56 L160 70 L210 45 L260 40 L310 48 L310 132 Z" fill="url(#fill)"/>
        <polyline points="60,88 110,56 160,70 210,45 260,40 310,48" fill="none" stroke="#2F80FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#2F80FF"><circle cx="60" cy="88" r="3"/><circle cx="110" cy="56" r="3"/><circle cx="160" cy="70" r="3"/><circle cx="210" cy="45" r="3"/><circle cx="260" cy="40" r="3"/><circle cx="310" cy="48" r="3"/></g>
      </svg>
      <div class="mono" style="position:absolute;left:0;top:0;color:#A0ADB8;font-size:10px;">800</div>
      <div class="mono" style="position:absolute;left:0;top:72px;color:#A0ADB8;font-size:10px;">400</div>
      <div class="mono" style="position:absolute;left:0;bottom:2px;color:#A0ADB8;font-size:10px;">0</div>
    </div>
  </div>

  <!-- Command -->
  <div class="card row" style="gap:10px;padding:12px 16px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
    <div class="mono" style="flex:1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">iperf3 -c 192.0.2.10 -p 5201 -t 10 -R -J</div>
  </div>

  <!-- Cancel -->
  <button style="width:100%;height:44px;border:none;border-radius:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:rgba(255,96,112,.13);color:var(--red);font-size:14px;font-weight:600;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    Cancel test
  </button>

</div>
</x-dc>
</body>
</html>
