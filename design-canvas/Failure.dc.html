<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#05090D; --surf:#0B1218; --raised:#101920; --border:#24313A;
      --text:#F4F7FA; --muted:#AEB9C2; --teal:#14D8C4; --orange:#FF9800; --red:#FF6070;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--teal);} a:hover{color:#0fb3a2;}
    .screen{padding:14px 18px 36px;
      background:radial-gradient(120% 80% at 12% 18%, rgba(20,216,196,.09), transparent 60%),
                 radial-gradient(120% 90% at 100% 70%, rgba(47,128,255,.055), transparent 55%);}
    .stack{display:flex;flex-direction:column;}
    .row{display:flex;align-items:center;}
    .card{border-radius:24px;border:1px solid var(--border);
      background:linear-gradient(135deg,rgba(16,25,32,.96),rgba(11,18,24,.96));}
    .orb{display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
    .fbtn{width:100%;height:58px;border:none;border-radius:16px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:500;}
    svg{display:block;}
  </style>
</helmet>

<div class="screen stack" style="gap:18px;">

  <!-- Top bar -->
  <div class="row" style="height:68px;">
    <div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F4F7FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M10 6l-6 6 6 6"/></svg>
    </div>
    <div style="flex:1;text-align:center;font-size:24px;font-weight:600;">Test failed</div>
    <div style="width:48px;height:48px;display:flex;align-items:center;justify-content:center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F4F7FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 11l8-4M8 13l8 4"/></svg>
    </div>
  </div>

  <!-- Failure card -->
  <div class="card stack" style="align-items:center;padding:24px;gap:12px;border:1px solid rgba(255,96,112,.7);">
    <div class="orb" style="width:86px;height:86px;border-radius:29px;background:rgba(255,96,112,.11);border:1px solid rgba(255,96,112,.25);">
      <svg width="47" height="47" viewBox="0 0 24 24" fill="none" stroke="#FF6070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 17H3z"/><path d="M12 9v4"/><circle cx="12" cy="17" r="0.9" fill="#FF6070"/></svg>
    </div>
    <div style="color:var(--red);font-size:26px;font-weight:800;text-align:center;">TCP Download failed</div>
    <div style="font-size:17px;text-align:center;">Could not reach the iperf3 server. Check the address and that iperf3 -s is running.</div>
    <div style="color:var(--muted);font-size:14px;text-align:center;">No test was allowed to continue blindly after this failure.</div>
  </div>

  <!-- Retry -->
  <button class="fbtn" style="background:rgba(20,216,196,.13);color:var(--teal);">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#14D8C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.6 5.5A8 8 0 1 0 20 12" /><path d="M17 3l3 1-1 3"/></svg>
    Retry
  </button>
  <!-- Copy safe diagnostics -->
  <button class="fbtn" style="background:rgba(174,185,194,.13);color:var(--muted);">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#AEB9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3-1 8-3 5-4 2-4-2-3-5-1-8 8-3M9 12l2 2 4-4"/></svg>
    Copy privacy-safe diagnostics
  </button>

  <!-- Technical details (collapsed) -->
  <div class="card row" style="padding:20px;">
    <div class="row" style="flex:1;gap:10px;">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#F4F7FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></svg>
      <div style="font-size:18px;font-weight:500;">Technical details</div>
    </div>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#AEB9C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>

</div>
</x-dc>
</body>
</html>
