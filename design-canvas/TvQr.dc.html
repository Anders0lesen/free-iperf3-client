<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#05090D; --surf:#0B1218; --raised:#101920; --border:#24313A;
      --text:#F4F7FA; --muted:#AEB9C2; --teal:#14D8C4; --blue:#2F80FF;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:rgba(5,9,13,.72);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:var(--teal);} a:hover{color:#0fb3a2;}
    .stack{display:flex;flex-direction:column;}
    .row{display:flex;align-items:center;}
    .fbtn{height:46px;border:none;border-radius:14px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;}
    svg{display:block;}
  </style>
</helmet>

<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="row" style="gap:24px;padding:24px;border-radius:22px;background:var(--raised);border:1px solid var(--border);align-items:center;">

    <!-- QR -->
    <div style="width:240px;height:240px;border-radius:14px;background:#FFFFFF;padding:14px;flex:0 0 auto;">
      <svg width="100%" height="100%" viewBox="0 0 100 100" shape-rendering="crispEdges">
        <rect width="100" height="100" fill="#fff"/>
        <g fill="#000">
          <rect x="6" y="6" width="24" height="24"/><rect x="12" y="12" width="12" height="12" fill="#fff"/><rect x="15" y="15" width="6" height="6" fill="#000"/>
          <rect x="70" y="6" width="24" height="24"/><rect x="76" y="12" width="12" height="12" fill="#fff"/><rect x="79" y="15" width="6" height="6" fill="#000"/>
          <rect x="6" y="70" width="24" height="24"/><rect x="12" y="76" width="12" height="12" fill="#fff"/><rect x="15" y="79" width="6" height="6" fill="#000"/>
          <rect x="38" y="8" width="4" height="4"/><rect x="46" y="8" width="4" height="4"/><rect x="54" y="12" width="4" height="4"/>
          <rect x="38" y="16" width="4" height="4"/><rect x="50" y="18" width="4" height="4"/><rect x="60" y="20" width="4" height="4"/>
          <rect x="8" y="38" width="4" height="4"/><rect x="16" y="42" width="4" height="4"/><rect x="24" y="38" width="4" height="4"/>
          <rect x="40" y="40" width="4" height="4"/><rect x="48" y="44" width="4" height="4"/><rect x="56" y="40" width="4" height="4"/><rect x="64" y="48" width="4" height="4"/>
          <rect x="72" y="40" width="4" height="4"/><rect x="80" y="44" width="4" height="4"/><rect x="88" y="40" width="4" height="4"/>
          <rect x="38" y="58" width="4" height="4"/><rect x="46" y="62" width="4" height="4"/><rect x="54" y="58" width="4" height="4"/><rect x="62" y="62" width="4" height="4"/>
          <rect x="70" y="60" width="4" height="4"/><rect x="78" y="64" width="4" height="4"/><rect x="86" y="60" width="4" height="4"/>
          <rect x="40" y="72" width="4" height="4"/><rect x="48" y="76" width="4" height="4"/><rect x="56" y="72" width="4" height="4"/><rect x="64" y="80" width="4" height="4"/>
          <rect x="72" y="76" width="4" height="4"/><rect x="80" y="72" width="4" height="4"/><rect x="88" y="80" width="4" height="4"/>
          <rect x="40" y="86" width="4" height="4"/><rect x="52" y="88" width="4" height="4"/><rect x="60" y="86" width="4" height="4"/>
        </g>
      </svg>
    </div>

    <!-- Right: text + close -->
    <div class="stack" style="width:300px;gap:14px;">
      <div class="row" style="gap:10px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F80FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14v4h3M17 14h4M19 14v3M17 21h4M21 17v4"/></svg>
        <div style="color:var(--blue);font-size:20px;font-weight:600;">Scan on your phone</div>
      </div>
      <div style="color:var(--muted);font-size:14px;line-height:20px;">Move the selected command and result summary to a phone — no remote typing. Generated locally on this device; contains the server address and command, but no raw iperf3 output.</div>
      <button class="fbtn" style="background:rgba(20,216,196,.13);color:var(--teal);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14D8C4" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        Close
      </button>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
